name: Build beta release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish beta
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release jars
        run: ./gradlew clean build --no-daemon --refresh-dependencies

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OTL-beta-jars
          path: |
            build/libs/OTL-0.3.0.jar
            build/libs/OTL-0.3.0-sources.jar
