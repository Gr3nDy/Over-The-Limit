buildscript {
    repositories {
        maven { url 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT' }
    // 2.1-SNAPSHOT is the only ForgeGradle line cached for offline builds. Reuse that artifact
    // instead of re-resolving a moving snapshot; pin a release here when one is published.
    configurations.all { resolutionStrategy.cacheChangingModulesFor 365, 'days' }
}
apply plugin: 'net.minecraftforge.gradle.forge'
version = '0.3.9'
group = 'otl'
archivesBaseName = 'OTL'
sourceCompatibility = targetCompatibility = '1.8'
minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}
repositories { mavenCentral() }
dependencies { testCompile 'junit:junit:4.13.2' }
jar { archiveName = 'OTL.jar'; from project(':').file('license/LICENSE'), { into 'META-INF'; rename { 'LICENSE' } }; from project(':').file('license/NOTICE.md'), { into 'META-INF' }; from project(':').file('license/LICENSE-CC-BY-SA-4.0.txt'), { into 'META-INF' }; exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**' }
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
processResources {
    exclude '**/*.part'
    inputs.property 'version', project.version
    eachFile { if (it.path == 'mcmod.info') it.expand(version: project.version) }
}
// Bundled map names are generated from the assets so the source tree has no duplicated index.
task generateMapPreviewIndex {
    def maps = file('src/main/resources/assets/otl/maps')
    def output = file("$buildDir/generated/otlIndex/java/otl/client/MapPreviewIndex.java")
    inputs.dir maps
    outputs.file output
    doLast {
        def paths = []
        maps.eachFileRecurse { f ->
            if (f.isFile() && (f.name.endsWith('.png') || f.name.endsWith('.xml'))) paths << maps.toPath().relativize(f.toPath()).toString().replace('\\', '/')
        }
        paths.sort()
        def sb = new StringBuilder()
        sb << 'package otl.client;\n\nfinal class MapPreviewIndex {\n    static final String[] PATHS={\n'
        paths.eachWithIndex { p, i ->
            sb << '        "' << p.replace('\\', '\\\\').replace('"', '\\"') << '"'
            if (i < paths.size() - 1) sb << ','
            sb << '\n'
        }
        sb << '    };\n}\n'
        output.parentFile.mkdirs()
        output.text = sb.toString()
    }
}
sourceSets.main.java.srcDir "$buildDir/generated/otlIndex/java"
compileJava.dependsOn generateMapPreviewIndex
if (project.hasProperty('otlSmoke')) { sourceSets.main.java.srcDir 'src/otlSmoke/java' }
if (project.hasProperty('otlSmokeRemote')) { runClient.jvmArgs '-Dotl.smoke.remote=true' }
if (project.hasProperty('otlSmokeServer')) { runClient.jvmArgs '-Dotl.smoke.server=true' }
if (project.hasProperty('otlSmokeServerOnly')) { runClient.jvmArgs '-Dotl.smoke.server=true', '-Dotl.smoke.serverOnly=true' }
if (project.hasProperty('otlSmokeScope')) { runClient.jvmArgs "-Dotl.smoke.scope=${project.property('otlSmokeScope')}" }
jar {
    destinationDir = file("${buildDir}/dev-libs")
    inputs.property 'otlSmoke', project.hasProperty('otlSmoke')
    if (!project.hasProperty('otlSmoke')) exclude '**/OtlSmoke*'
}
// The mod metadata must agree with the artifact version.
task checkVersion {
    doLast {
        def src = file('src/main/java/otl/client/Otl.java').getText('UTF-8')
        def mod = (src =~ /@Mod\([^)]*version="([^"]+)"/)
        def constant = (src =~ /VERSION="([^"]+)"/)
        if (!mod.find() || mod.group(1) != project.version)
            throw new GradleException("Otl.java @Mod version must match project.version ${project.version}")
        if (!constant.find() || constant.group(1) != project.version)
            throw new GradleException("Otl.VERSION must match project.version ${project.version}")
    }
}
// The game and smoke runs may overwrite dev-libs, never the manual-copy release.
task releaseJar(dependsOn: ['test', 'checkVersion', 'reobfJar']) {
    doLast {
        if (project.hasProperty('otlSmoke')) throw new GradleException('Release builds must not use -PotlSmoke')
        def jarFile = jar.archivePath
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entry = zip.getEntry('otl/client/Otl.class')
            if (entry == null) throw new GradleException("otl/client/Otl.class missing from ${jarFile}")
            def bytes = zip.getInputStream(entry).getBytes()
            if (new String(bytes, 'ISO-8859-1').contains('getRenderManager'))
                throw new GradleException("${jarFile} is not reobfuscated (MCP name getRenderManager); rebuild with reobfJar")
            if (zip.entries().find { it.name.startsWith('otl/client/OtlSmoke') })
                throw new GradleException("${jarFile} contains the smoke harness; rebuild without -PotlSmoke")
        } finally { zip.close() }
        copy { from jarFile; into "${buildDir}/libs" }
        println "Verified release: ${buildDir}/libs/OTL.jar (${jarFile.length()} bytes). Copy it manually."
    }
}
build.dependsOn releaseJar
sourceJar {
    archiveName = 'OTL-source.jar'
    from sourceSets.main.allSource
    from project(':').file('license/LICENSE'), { into 'META-INF'; rename { 'LICENSE' } }
    from project(':').file('license/NOTICE.md'), { into 'META-INF' }
    from project(':').file('license/LICENSE-CC-BY-SA-4.0.txt'), { into 'META-INF' }
}
