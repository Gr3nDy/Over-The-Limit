buildscript {
    repositories {
        maven { url 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT' }
}
apply plugin: 'net.minecraftforge.gradle.forge'
version = '0.3.1'
group = 'otl'
archivesBaseName = 'OTL'
sourceCompatibility = targetCompatibility = '1.8'
minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}
repositories { mavenCentral() }
dependencies { testCompile 'junit:junit:4.13.2' }
jar { archiveName = 'OTL.jar'; from project(':').file('LICENSE'), { into 'META-INF'; rename { 'LICENSE' } }; exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**' }
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
if (project.hasProperty('otlSmoke')) { sourceSets.main.java.srcDir 'src/otlSmoke/java' }
jar {
    inputs.property 'otlSmoke', project.hasProperty('otlSmoke')
    if (!project.hasProperty('otlSmoke')) exclude '**/OtlSmoke*'
}
// Always deploy through this task: `jar` (and therefore `runClient`) overwrites build/libs/OTL.jar
// with MCP-named dev classes, which crash Forge/Lunar with NoSuchMethodError.
task deploy(dependsOn: 'reobfJar') {
    doLast {
        def target = project.hasProperty('deployDir')
                ? file(project.property('deployDir'))
                : file("${System.getProperty('user.home')}/.lunarclient/profiles/1.8/mods/forge-1.8.9")
        if (!target.isDirectory()) throw new GradleException("Mods folder not found: ${target} (pass -PdeployDir=<folder>)")
        def jarFile = file("${buildDir}/libs/OTL.jar")
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entry = zip.getEntry('otl/client/Otl.class')
            if (entry == null) throw new GradleException("otl/client/Otl.class missing from ${jarFile}")
            def bytes = zip.getInputStream(entry).getBytes()
            if (new String(bytes, 'ISO-8859-1').contains('getRenderManager'))
                throw new GradleException("${jarFile} is not reobfuscated (MCP name getRenderManager); rebuild with reobfJar")
            if (zip.getEntry('otl/client/OtlSmoke.class') != null)
                throw new GradleException("${jarFile} contains the smoke harness; rebuild without -PotlSmoke")
        } finally { zip.close() }
        copy { from jarFile; into target }
        println "Deployed ${jarFile.name} (${jarFile.length()} bytes) to ${target}"
    }
}
sourceJar {
    archiveName = 'OTL-source.jar'
    from sourceSets.main.allSource
    from project(':').file('LICENSE'), { into 'META-INF'; rename { 'LICENSE' } }
}
