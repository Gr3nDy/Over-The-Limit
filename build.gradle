buildscript {
    repositories {
        maven { url 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT' }
}
apply plugin: 'net.minecraftforge.gradle.forge'
version = '0.3.6'
group = 'otl'
archivesBaseName = 'OTL'
sourceCompatibility = targetCompatibility = '1.8'
minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    runDir = 'run'
    mappings = 'stable_22'
}
repositories { mavenCentral() }
dependencies { testCompile 'junit:junit:4.13.2' }
jar { archiveName = 'OTL.jar'; from project(':').file('LICENSE'), { into 'META-INF'; rename { 'LICENSE' } }; from project(':').file('NOTICE.md'), { into 'META-INF' }; from project(':').file('LICENSE-CC-BY-SA-4.0.txt'), { into 'META-INF' }; exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**' }
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
processResources { exclude '**/*.part' }
if (project.hasProperty('otlSmoke')) { sourceSets.main.java.srcDir 'src/otlSmoke/java' }
if (project.hasProperty('otlSmokeRemote')) { runClient.jvmArgs '-Dotl.smoke.remote=true' }
if (project.hasProperty('otlSmokeServer')) { runClient.jvmArgs '-Dotl.smoke.server=true' }
if (project.hasProperty('otlSmokeServerOnly')) { runClient.jvmArgs '-Dotl.smoke.server=true', '-Dotl.smoke.serverOnly=true' }
if (project.hasProperty('otlSmokeScope')) { runClient.jvmArgs "-Dotl.smoke.scope=${project.property('otlSmokeScope')}" }
jar {
    destinationDir = file("${buildDir}/dev-libs")
    inputs.property 'otlSmoke', project.hasProperty('otlSmoke')
    if (!project.hasProperty('otlSmoke')) exclude '**/OtlSmoke*'
}
// The game and smoke runs may overwrite dev-libs, never the manual-copy release.
task releaseJar(dependsOn: ['test', 'reobfJar']) {
    doLast {
        if (project.hasProperty('otlSmoke')) throw new GradleException('Release builds must not use -PotlSmoke')
        def jarFile = jar.archivePath
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            def entry = zip.getEntry('otl/client/Otl.class')
            if (entry == null) throw new GradleException("otl/client/Otl.class missing from ${jarFile}")
            def bytes = zip.getInputStream(entry).getBytes()
            if (new String(bytes, 'ISO-8859-1').contains('getRenderManager'))
                throw new GradleException("${jarFile} is not reobfuscated (MCP name getRenderManager); rebuild with reobfJar")
            if (zip.entries().find { it.name.startsWith('otl/client/OtlSmoke') })
                throw new GradleException("${jarFile} contains the smoke harness; rebuild without -PotlSmoke")
        } finally { zip.close() }
        copy { from jarFile; into "${buildDir}/libs" }
        println "Verified release: ${buildDir}/libs/OTL.jar (${jarFile.length()} bytes). Copy it manually."
    }
}
build.dependsOn releaseJar
sourceJar {
    archiveName = 'OTL-source.jar'
    from sourceSets.main.allSource
    from project(':').file('LICENSE'), { into 'META-INF'; rename { 'LICENSE' } }
    from project(':').file('NOTICE.md'), { into 'META-INF' }
    from project(':').file('LICENSE-CC-BY-SA-4.0.txt'), { into 'META-INF' }
}
