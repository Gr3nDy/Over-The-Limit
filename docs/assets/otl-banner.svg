<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Over The Limit</title>
  <desc id="desc">Dark blocky arena with a golden EXP crosshair and a queued three-line kill confirmation.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#0a1628"/>
      <stop offset="1" stop-color="#142a36"/>
    </linearGradient>
    <linearGradient id="floor" x2="0" y2="1">
      <stop stop-color="#254a4b"/>
      <stop offset="1" stop-color="#0a1b26"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a2d8db" stroke-opacity=".065"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="url(#sky)"/>
  <path d="M0 265H170V240H240V256H326V224H405V251H480V236H560V263H660V244H764V266H848V234H924V253H1020V226H1115V252H1200V360H0Z" fill="#1c3e48"/>
  <path d="M0 287H145V271H270V291H366V265H487V288H592V271H716V295H843V269H968V287H1107V267H1200V360H0Z" fill="url(#floor)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <path d="M0 0H1200V360H0Z" fill="none" stroke="#537078" stroke-width="2"/>
  <path d="M0 0H1200V6H0Z" fill="#e7ac56"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="68" y="143" fill="#f6f6ef" font-size="67" font-weight="800" letter-spacing="5">OVER THE LIMIT</text>
    <rect x="70" y="161" width="72" height="5" fill="#f5bc65"/>
    <text x="70" y="206" fill="#b9cbd1" font-size="22" font-weight="600" letter-spacing="3">OVERCAST COMMUNITY UTILITIES</text>
    <text x="70" y="244" fill="#83a9b2" font-size="18" letter-spacing="1">FORGE 1.8.9  /  v0.3.3</text>
  </g>
  <g transform="translate(776 178)">
    <circle r="46" fill="#f3b95c" opacity=".32" filter="url(#glow)"/>
    <circle r="30" fill="none" stroke="#e6b966" stroke-opacity=".35" stroke-width="2"/>
    <path d="M-46 0h24M22 0h24M0-46v24M0 22v24" stroke="#f6c275" stroke-width="3"/>
    <circle r="4" fill="#fbd28a"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="800">
    <text x="760" y="137" fill="#f5bd64" font-size="37">+20 EXP</text>
    <rect x="900" y="153" width="233" height="132" rx="8" fill="#091826" fill-opacity=".82" stroke="#4a6c72"/>
    <rect x="900" y="153" width="4" height="132" fill="#e3ac5b"/>
    <text x="925" y="187" fill="#c0d1d5" font-size="19" letter-spacing="1">TRIPLE KILL</text>
    <text x="925" y="226" fill="#ffffff" font-size="21" letter-spacing="1">KILL</text>
    <text x="925" y="265" fill="#f8d795" font-size="19" letter-spacing="1">MULTI KILL</text>
  </g>
</svg>
